services:
  bmori:
    image: ${DOCKER_REGISTRY}/${ENV}/${APP}/${SERVICE}:latest
    container_name: ${APP}-${SERVICE}-${ENV}

    restart: unless-stopped

    env_file:
      - .env

    networks:
      - traefik-public

    ports:
      - ${PORT}:80

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"

      - 'traefik.http.routers.b-mori-http.rule=HostRegexp(`^cejuntos\..+$`)'
      - "traefik.http.routers.b-mori-http.entrypoints=web"
      - "traefik.http.routers.b-mori-http.middlewares=secure-chain@file"
      - "traefik.http.routers.b-mori-http.service=bmori"
      - "traefik.http.routers.b-mori-http.priority=200"

      - 'traefik.http.routers.b-mori-https.rule=HostRegexp(`^cejuntos\..+$`)'
      - "traefik.http.routers.b-mori-https.entrypoints=websecure"
      - "traefik.http.routers.b-mori-https.tls=true"
      - "traefik.http.routers.b-mori-https.middlewares=secure-chain@file"
      - "traefik.http.routers.b-mori-https.service=bmori"
      - "traefik.http.routers.b-mori-https.priority=200"
      - "traefik.http.services.bmori.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
