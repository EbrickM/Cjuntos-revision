events {
    # Configuración mínima requerida para que Nginx arranque
    worker_connections 1024;
}

http {
    # Incluye el tipo MIME estándar
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        # 1. PUERTO CORREGIDO: Usamos 8080 (válido para usuario non-root 'nobody')
        listen 8080;
        server_name localhost;

        # Ruta donde están tus archivos estáticos
        root /usr/share/nginx/html;
        index index.html;

        # 2. CORREGIDO PARA SPA: Redirige todas las rutas a index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Opcional: Compresión gzip para mejorar rendimiento
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    }
}