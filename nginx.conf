events {
    # Configuración mínima requerida para que Nginx arranque
    worker_connections 1024;
}

http {
    # Incluye el tipo MIME estándar
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Ruta donde están tus archivos estáticos
        root /usr/share/nginx/html;
        index index.html;

        # 2. CORREGIDO PARA SPA: Redirige todas las rutas a index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite's build output under /assets/ is content-hashed (the filename
        # changes whenever the file changes), so it's safe to cache forever —
        # a stale cached copy can never be served under the old URL.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html is the one filename that never changes but whose content
        # does on every deploy (it references the current hashed assets), so
        # it must always be revalidated instead of cached.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # No backend proxy here — stage/production call the backends
        # directly at absolute URLs injected at container start via
        # config.json (see docker-entrypoint.sh and src/config.ts).
        # no-store: this filename is fixed (unlike Vite's hashed assets), so
        # without this a browser/CDN could keep serving stale URLs from a
        # previous deploy of the same image.
        location = /config.json {
            add_header Cache-Control "no-store";
        }

        # 3. Endpoint para healthcheck
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Opcional: Compresión gzip para mejorar rendimiento
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    }
}