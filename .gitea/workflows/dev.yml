name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurar BuildKit para construir la imagen con caché
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: |
            b-mori:dev-${{ gitea.sha }}
            b-mori:dev
          # Caché usando GitHub Actions (persistente entre runs)
          cache-from: type=gha,scope=deploy-dev
          cache-to: type=gha,scope=deploy-dev,mode=max
          # La imagen se carga localmente en el runner (no se sube a un registry)
          load: true

      - name: Deploy with health check
        run: |
          set -e
          # Detener y eliminar el contenedor anterior
          docker stop b-mori-dev || true
          docker rm b-mori-dev || true

          # Arrancar el nuevo
          docker run -d --name b-mori-dev -p 8081:80 b-mori:dev-${{ gitea.sha }}

          # Esperar a que esté saludable (máx 30s)
          echo "⏳ Verificando que el contenedor esté funcionando..."
          for i in $(seq 1 10); do
            if curl -s -f -o /dev/null http://localhost:8081; then
              echo "✅ Despliegue exitoso."
              exit 0
            fi
            sleep 1
          done

          # Si falla, mostrar logs y fallar el job
          echo "❌ El contenedor no responde después de 30s. Revisa los logs:"
          docker logs b-mori-dev
          exit 1

      # Limpieza de imágenes antiguas (conserva las 3 más recientes)
      - name: Clean old images
        run: |
          echo "🧹 Eliminando imágenes antiguas..."
          docker images b-mori --format "{{.ID}} {{.CreatedAt}} {{.Tag}}" | \
            grep -v "dev" | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi -f
          docker image prune -f