name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BuildKit para builds más rápidos
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      # Cache local (persiste en el runner)
      - name: Build with local cache
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: |
            b-mori:dev-${{ gitea.sha }}
            b-mori:dev
          # Cache local: rápido y sin dependencias externas
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          load: true

      - name: Zero-downtime deployment
        run: |
          set -e
          
          echo "🚀 Iniciando despliegue..."
          
          # Variables
          CONTAINER_NEW="b-mori-dev-new"
          CONTAINER_ACTIVE="b-mori-dev"
          CONTAINER_OLD="b-mori-dev-old"
          IMAGE_TAG="b-mori:dev-${{ gitea.sha }}"
          PORT=8081
          
          # Verificar si hay contenedor activo
          ACTIVE_EXISTS=false
          if docker ps --filter "name=$CONTAINER_ACTIVE" --format "{{.Names}}" 2>/dev/null | grep -q "$CONTAINER_ACTIVE"; then
            ACTIVE_EXISTS=true
            echo "📦 Contenedor activo detectado"
          fi
          
          # 1. Iniciar nuevo contenedor en puerto alternativo
          echo "🚀 Iniciando nuevo contenedor en puerto 8082..."
          docker run -d \
            --name $CONTAINER_NEW \
            --restart unless-stopped \
            -p 8082:8080 \
            $IMAGE_TAG
          
          # 2. Esperar healthcheck o curl
          echo "⏳ Verificando nuevo contenedor..."
          HEALTHY=false
          for i in $(seq 1 15); do
            # Primero intentar healthcheck de Docker
            if docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NEW 2>/dev/null | grep -q "healthy"; then
              HEALTHY=true
              echo "✅ Healthcheck OK!"
              break
            fi
            
            # Fallback: curl
            if curl -s -f -o /dev/null http://localhost:8082; then
              HEALTHY=true
              echo "✅ Respuesta HTTP OK!"
              break
            fi
            
            # Verificar que el contenedor sigue corriendo
            if ! docker ps --filter "name=$CONTAINER_NEW" --format "{{.Status}}" | grep -q "Up"; then
              echo "❌ Contenedor se detuvo. Logs:"
              docker logs $CONTAINER_NEW
              docker rm $CONTAINER_NEW 2>/dev/null || true
              exit 1
            fi
            
            echo "⏳ Esperando... ($i/15)"
            sleep 2
          done
          
          if [ "$HEALTHY" = false ]; then
            echo "❌ Nuevo contenedor no responde. Logs:"
            docker logs $CONTAINER_NEW
            docker rm $CONTAINER_NEW 2>/dev/null || true
            exit 1
          fi
          
          # 3. Switch: detener activo, renombrar
          if [ "$ACTIVE_EXISTS" = true ]; then
            echo "🔄 Switcheando tráfico..."
            docker stop $CONTAINER_ACTIVE 2>/dev/null || true
            docker rename $CONTAINER_ACTIVE $CONTAINER_OLD 2>/dev/null || true
          fi
          
          docker rename $CONTAINER_NEW $CONTAINER_ACTIVE
          
          # 4. Reconfigurar puerto (recrear con puerto correcto)
          echo "🔧 Reconfigurando puerto $PORT..."
          
          # Guardar ID para mantener el mismo contenedor
          ACTIVE_ID=$(docker inspect --format='{{.Id}}' $CONTAINER_ACTIVE 2>/dev/null || echo "")
          
          if [ -n "$ACTIVE_ID" ]; then
            # Recrear manteniendo el mismo contenedor
            docker stop $CONTAINER_ACTIVE
            docker rm $CONTAINER_ACTIVE
            
            docker run -d \
              --name $CONTAINER_ACTIVE \
              --restart unless-stopped \
              -p $PORT:8080 \
              $IMAGE_TAG
          else
            echo "❌ Error: No se pudo obtener ID del contenedor"
            exit 1
          fi
          
          # 5. Verificar deploy final
          echo "⏳ Verificando despliegue final..."
          sleep 3
          
          if curl -s -f -o /dev/null http://localhost:$PORT; then
            echo "✅ Contenedor respondiendo en puerto $PORT"
          else
            echo "❌ Falló el deploy. Rollback..."
            
            # Rollback al contenedor anterior
            if docker ps --filter "name=$CONTAINER_OLD" --format "{{.Names}}" 2>/dev/null | grep -q "$CONTAINER_OLD"; then
              echo "🔄 Restaurando versión anterior..."
              docker stop $CONTAINER_ACTIVE 2>/dev/null || true
              docker rm $CONTAINER_ACTIVE 2>/dev/null || true
              docker rename $CONTAINER_OLD $CONTAINER_ACTIVE
              docker start $CONTAINER_ACTIVE
              echo "✅ Rollback completado"
            fi
            exit 1
          fi
          
          # 6. Limpiar contenedor viejo (después de un tiempo)
          if docker ps --filter "name=$CONTAINER_OLD" --format "{{.Names}}" 2>/dev/null | grep -q "$CONTAINER_OLD"; then
            echo "⏳ Esperando 10s para limpiar contenedor viejo..."
            sleep 10
            
            echo "🧹 Eliminando contenedor viejo"
            docker stop $CONTAINER_OLD 2>/dev/null || true
            docker rm $CONTAINER_OLD 2>/dev/null || true
          fi
          
          echo "✅ Despliegue completado!"
          echo "🌐 http://localhost:$PORT"

      - name: Debug on failure
        if: failure()
        run: |
          echo "📋 Logs del nuevo contenedor:"
          docker logs b-mori-dev-new 2>&1 | tail -30 || echo "No existe"
          echo ""
          echo "📋 Logs del contenedor activo:"
          docker logs b-mori-dev 2>&1 | tail -30 || echo "No existe"
          echo ""
          echo "📊 Estado de todos los contenedores:"
          docker ps -a --filter "name=b-mori"
          echo ""
          echo "📊 Imágenes:"
          docker images b-mori

      - name: Clean old images
        run: |
          echo "🧹 Limpiando imágenes antiguas..."
          
          # Conservar las 5 más recientes
          docker images b-mori --format "{{.ID}} {{.CreatedAt}} {{.Tag}}" | \
            grep -E "dev-[a-f0-9]{40}" | \
            sort -k2 -r | \
            tail -n +6 | \
            awk '{print $1}' | \
            xargs -r docker rmi -f 2>/dev/null || true
          
          # Limpiar dangling
          docker image prune -f --filter "until=24h"
          
          # Limpiar cache de buildx (opcional, cada cierto tiempo)
          # docker buildx prune -f --filter "until=48h"
          
          echo "📊 Espacio en disco:"
          df -h /