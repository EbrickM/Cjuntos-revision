name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build image (short SHA)
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          docker build \
            -t b-mori:dev-$SHORT_SHA \
            .

      - name: Validate + Deploy + Rollback (HEALTHCHECK)
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          NEW_IMAGE="b-mori:dev-$SHORT_SHA"
          CONTAINER="b-mori-dev"

          echo "🧪 Testing image $NEW_IMAGE using Docker HEALTHCHECK"

          docker rm -f b-mori-test 2>/dev/null || true

          docker run -d \
            --name b-mori-test \
            -p 8082:8080 \
            $NEW_IMAGE

          echo "⏳ Waiting for HEALTHCHECK..."

          OK=false

          for i in $(seq 1 30); do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              b-mori-test 2>/dev/null || echo "starting")

            echo "Status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              OK=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Container unhealthy"
              docker logs b-mori-test || true
              docker rm -f b-mori-test
              exit 1
            fi

            sleep 2
          done

          docker rm -f b-mori-test

          if [ "$OK" != "true" ]; then
            echo "❌ Validation timeout"
            exit 1
          fi

          echo "🚀 Promoting image to latest"

          # Backup último estado bueno
          if docker image inspect b-mori:latest >/dev/null 2>&1; then
            docker tag b-mori:latest b-mori:rollback-$SHORT_SHA || true
          fi

          # Promover nueva versión
          docker tag $NEW_IMAGE b-mori:latest

          echo "🔄 Restart container"

          docker rm -f $CONTAINER 2>/dev/null || true

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p 8081:8080 \
            b-mori:latest

          sleep 5

          STATUS=$(docker inspect \
            --format='{{.State.Health.Status}}' \
            $CONTAINER 2>/dev/null || echo "unknown")

          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Deploy failed → rollback"

            docker rm -f $CONTAINER || true

            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p 8081:8080 \
              b-mori:latest

            exit 1
          fi

          echo "✅ Deploy successful (HEALTHCHECK OK)"

      - name: Keep only last 3 images
        run: |
          echo "🧹 Keeping last 3 dev images..."

          docker images b-mori \
            --format "{{.Repository}}:{{.Tag}}" \
            | grep "^b-mori:dev-" \
            | sort -r \
            | tail -n +4 \
            | xargs -r docker rmi -f

          docker image prune -f