name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - '.gitea/workflows/**'    

env:
  APP: b-mori-front
  CONTAINER: b-mori-front-dev

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Determine npm registry
        run: |
          REGISTRY="${{ vars.NPM_REGISTRY }}"
          if [ -n "$REGISTRY" ] && npm ping --registry="$REGISTRY" --timeout=5000 2>/dev/null; then
            echo "Using Verdaccio: $REGISTRY"
            echo "registry_url=$REGISTRY" >> $GITEA_ENV
          else
            echo "Using default npm registry"
            echo "registry_url=https://registry.npmjs.org/" >> $GITEA_ENV
          fi

      - name: Build image
        run: |
          set -e
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITEA_ENV
          docker build \
            --build-arg NPM_REGISTRY=$registry_url \
            -t $APP:dev-$SHORT_SHA \
            .

      - name: Promote image
        run: |
          set -e
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          if docker image inspect $APP:latest >/dev/null 2>&1; then
            docker tag $APP:latest $APP:rollback || true
          fi
          docker tag $APP:dev-$SHORT_SHA $APP:latest

      - name: Deploy container
        run: |
          set -e
          docker rm -f $CONTAINER 2>/dev/null || true
          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p 8081:80 \
            $APP:latest

      - name: Cleanup images
        if: always()
        run: |
          docker images $APP \
            --format "{{.Repository}}:{{.Tag}}" \
            | grep "^$APP:dev-" \
            | sort -r \
            | tail -n +4 \
            | xargs -r docker rmi -f
          docker image prune -f