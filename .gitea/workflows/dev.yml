name: Deploy Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          docker build \
            -t b-mori:dev-$SHORT_SHA \
            .

      - name: Validate image healthcheck
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          IMAGE="b-mori:dev-$SHORT_SHA"

          docker rm -f b-mori-test 2>/dev/null || true

          docker run -d \
            --name b-mori-test \
            -p 8082:80 \
            $IMAGE

          echo "⏳ Waiting for healthcheck..."

          for i in $(seq 1 30); do

            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' \
              b-mori-test)

            echo "Attempt $i/30 -> $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Healthcheck passed"
              docker rm -f b-mori-test
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              echo "❌ Healthcheck failed"
              docker logs b-mori-test || true
              docker rm -f b-mori-test
              exit 1
            fi

            sleep 5
          done

          echo "❌ Healthcheck timeout"
          docker logs b-mori-test || true
          docker rm -f b-mori-test
          exit 1

      - name: Promote image
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          if docker image inspect b-mori:latest >/dev/null 2>&1; then
            docker tag b-mori:latest b-mori:rollback-latest || true
          fi

          docker tag b-mori:dev-$SHORT_SHA b-mori:latest

          echo "✅ Image promoted to latest"

      - name: Deploy container
        run: |
          set -e

          CONTAINER="b-mori-dev"

          if docker ps -a --format "{{.Names}}" | grep -q "^${CONTAINER}$"; then

            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              $CONTAINER || true)

            if [ -n "$OLD_IMAGE" ]; then
              docker tag "$OLD_IMAGE" b-mori:rollback-current || true
            fi
          fi

          docker rm -f $CONTAINER 2>/dev/null || true

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p 8081:80 \
            b-mori:latest

          echo "⏳ Waiting for production healthcheck..."

          HEALTH_OK=false

          for i in $(seq 1 30); do

            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' \
              $CONTAINER)

            echo "Attempt $i/30 -> $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              HEALTH_OK=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTH_OK" = true ]; then
            echo "✅ Deploy successful"
            exit 0
          fi

          echo "❌ Deploy failed"

          docker logs $CONTAINER || true

          docker rm -f $CONTAINER || true

          if docker image inspect b-mori:rollback-latest >/dev/null 2>&1; then

            echo "🔄 Rolling back..."

            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p 8081:80 \
              b-mori:rollback-latest

            echo "✅ Rollback completed"
          else
            echo "⚠️ No rollback image available"
          fi

          exit 1

      - name: Cleanup old images
        if: always()
        run: |
          echo "🧹 Cleaning old development images"

          docker images b-mori \
            --format "{{.Repository}}:{{.Tag}}" \
            | grep "^b-mori:dev-" \
            | sort -r \
            | tail -n +4 \
            | xargs -r docker rmi -f

          docker image prune -f

