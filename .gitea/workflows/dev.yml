name: Deploy Dev (No Healthcheck)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build image (short SHA)
        run: |
          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          docker build \
            -t b-mori:dev-$SHORT_SHA \
            .

      - name: Quick start validation
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          IMAGE="b-mori:dev-$SHORT_SHA"

          echo "🚀 Testing container startup only"

          docker rm -f b-mori-test 2>/dev/null || true

          docker run -d \
            --name b-mori-test \
            -p 8082:80 \
            $IMAGE

          sleep 5

          # solo verificamos que siga vivo
          if ! docker ps --format "{{.Names}}" | grep -q "b-mori-test"; then
            echo "❌ Container crashed on startup"
            docker logs b-mori-test || true
            exit 1
          fi

          echo "✅ Container started successfully"

          docker rm -f b-mori-test

      - name: Promote latest + rollback safety
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)

          # backup del último stable
          if docker image inspect b-mori:latest >/dev/null 2>&1; then
            docker tag b-mori:latest b-mori:rollback-latest || true
          fi

          echo "🚀 Promoting new image to latest"
          docker tag b-mori:dev-$SHORT_SHA b-mori:latest

      - name: Deploy container
        run: |
          set -e

          CONTAINER="b-mori-dev"

          # backup del contenedor actual
          if docker ps -a --format "{{.Names}}" | grep -q "$CONTAINER"; then
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' $CONTAINER || true)
            if [ -n "$OLD_IMAGE" ]; then
              docker tag $OLD_IMAGE b-mori:rollback-current || true
            fi
          fi

          docker rm -f $CONTAINER 2>/dev/null || true

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            -p 8081:80 \
            b-mori:latest

          sleep 5

          if ! docker ps --format "{{.Names}}" | grep -q "$CONTAINER"; then
            echo "❌ Deploy failed → rollback"

            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p 8081:80 \
              b-mori:rollback-latest

            exit 1
          fi

          echo "✅ Deploy successful"

      - name: Keep last 3 images
        run: |
          echo "🧹 Cleaning old images"

          docker images b-mori \
            --format "{{.Repository}}:{{.Tag}}" \
            | grep "^b-mori:dev-" \
            | sort -r \
            | tail -n +4 \
            | xargs -r docker rmi -f

          docker image prune -f