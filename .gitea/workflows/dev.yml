name: Deploy Dev

on:
  push:
    branches:
      - develop

env:
  APP: b-mori-front
  CONTAINER: b-mori-front-dev

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Build image
        run: |
          set -e

          SHORT_SHA=$(echo "${{ gitea.sha }}" | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          docker build \
            -t $APP:dev-$SHORT_SHA \
            .

      # =========================
      # IMAGE HEALTHCHECK (DOCKER BUILT-IN)
      # =========================
      - name: Validate image health
        run: |
          set -e

          IMAGE=$APP:dev-$SHORT_SHA

          echo "🔎 Testing image: $IMAGE"

          docker rm -f health-test 2>/dev/null || true

          docker run -d \
            --name health-test \
            $IMAGE

          # event-driven (sin polling manual)
          timeout 60s docker events \
            --filter "container=health-test" \
            --filter "event=health_status" \
            --format "{{.Status}}" |
          while read STATUS; do

            echo "Event -> $STATUS"

            if [ "$STATUS" = "health_status:healthy" ]; then
              echo "✅ Image OK"
              docker rm -f health-test
              exit 0
            fi

            if [ "$STATUS" = "health_status:unhealthy" ]; then
              echo "❌ Image FAILED"

              docker logs health-test || true

              exit 1
            fi

          done

          echo "❌ Timeout waiting for health event"
          docker logs health-test || true
          exit 1

      # =========================
      # PROMOTE
      # =========================
      - name: Promote image
        run: |
          set -e

          if docker image inspect $APP:latest >/dev/null 2>&1; then
            docker tag $APP:latest $APP:rollback || true
          fi

          docker tag $APP:dev-$SHORT_SHA $APP:latest

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy container
        run: |
          set -e

          OLD_IMAGE=$(docker inspect $CONTAINER --format='{{.Config.Image}}' 2>/dev/null || true)

          if [ -n "$OLD_IMAGE" ]; then
            docker tag $OLD_IMAGE $APP:rollback-current || true
          fi

          docker rm -f $CONTAINER 2>/dev/null || true

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            $APP:latest

      # =========================
      # RUNTIME HEALTHCHECK (EVENT-DRIVEN)
      # =========================
      - name: Runtime healthcheck
        run: |
          set -e

          echo "⏳ Waiting for runtime health events..."

          # asegurar que existe
          if ! docker ps -q -f name=$CONTAINER | grep -q .; then
            echo "❌ Container not running"
            exit 1
          fi

          timeout 60s docker events \
            --filter "container=$CONTAINER" \
            --filter "event=health_status" \
            --format "{{.Status}}" |
          while read STATUS; do

            echo "Event -> $STATUS"

            if [ "$STATUS" = "health_status:healthy" ]; then
              echo "✅ Deploy OK"
              exit 0
            fi

            if [ "$STATUS" = "health_status:unhealthy" ]; then
              echo "❌ Deploy FAILED"

              docker logs $CONTAINER || true

              break
            fi

          done

          echo "🔄 ROLLBACK"

          docker rm -f $CONTAINER || true

          docker run -d \
            --name $CONTAINER \
            --restart unless-stopped \
            $APP:rollback

          exit 1

      # =========================
      # DEBUG ARTIFACTS
      # =========================
      - name: Collect debug info
        if: failure()
        run: |
          mkdir -p debug

          docker logs $CONTAINER > debug/logs.txt 2>&1 || true
          docker inspect $CONTAINER > debug/inspect.json 2>&1 || true
          docker images > debug/images.txt
          docker ps -a > debug/ps.txt
          docker events --since 10m > debug/events.txt || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-b-mori
          path: debug/

      # =========================
      # CLEANUP
      # =========================
      - name: Cleanup images
        if: always()
        run: |
          docker images $APP \
            --format "{{.Repository}}:{{.Tag}}" \
            | grep "^$APP:dev-" || true \
            | sort -r \
            | tail -n +4 \
            | xargs -r docker rmi -f

          docker image prune -f
          