name: Deploy Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nginx.conf'
      - '.gitea/workflows/**'

env:
  ENV: dev

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # 1. Checkout del código
      - uses: actions/checkout@v4

      # 2. Determinar el registro NPM
      - name: Determine npm registry
        run: |
          REGISTRY="${{ vars.NPM_REGISTRY }}"
          if [ -n "$REGISTRY" ] && npm ping --registry="$REGISTRY" --timeout=5000 2>/dev/null; then
            echo "Using Verdaccio: $REGISTRY"
            echo "registry_url=$REGISTRY" >> $GITEA_ENV
          else
            echo "Using default npm registry"
            echo "registry_url=https://registry.npmjs.org/" >> $GITEA_ENV
          fi

      # 3. Generar metadatos OCI y tags para la imagen
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Lista de imágenes a las que se aplicarán los tags
          images: |
            ${{ vars.DOCKER_REGISTRY }}/${{ env.ENV }}/${{ vars.APP }}/${{ vars.SERVICE }}
          # Definir los tags que se generarán
          tags: |
            type=sha,prefix=dev-,suffix=
            type=raw,value=latest
          # Labels estándar OCI (se añadirán automáticamente)
          labels: |
            org.opencontainers.image.title=${{ vars.APP }}-${{ vars.SERVICE }}
            org.opencontainers.image.vendor=${{ vars.VENDOR || 'Mi Empresa' }}
            org.opencontainers.image.authors=${{ vars.MAINTAINER || 'devops@empresa.com' }}
            org.opencontainers.image.description=${{ vars.DESCRIPTION || 'Aplicación desarrollada con Gitea Actions' }}

      # 4. Login en el registro Zot
      - name: Login to Docker registry
        run: |
          echo "${{ secrets.CI_BOT_PASSWORD }}" | \
            docker login ${{ vars.DOCKER_REGISTRY }} \
              -u ${{ vars.CI_BOT_USER }} \
              --password-stdin

      # 5. Construir y subir la imagen
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Carga la imagen en el daemon local para poder usarla en despliegues
          load: true
          # Sube al registro (solo subirá los tags que tengan el registro en el nombre)
          push: true
          # Tags generados por metadata-action (incluye tanto el nombre completo como el corto)
          tags: ${{ steps.meta.outputs.tags }}
          # Labels generados por metadata-action
          labels: ${{ steps.meta.outputs.labels }}
          # Argumentos de build (NPM_REGISTRY)
          build-args: |
            NPM_REGISTRY=${{ env.registry_url }}

      # 6. Promover imagen local (rollback)
      - name: Promote image (local)
        run: |
          set -e
          IMAGE="${{ vars.APP }}-${{ vars.SERVICE }}"
          if docker image inspect $IMAGE:latest >/dev/null 2>&1; then
            docker tag $IMAGE:latest $IMAGE:rollback || true
          fi

      # 7. Desplegar contenedor localmente
      - name: Deploy container (local)
        run: |
          set -e
          CONTAINER_NAME="${{ vars.APP }}-${{ vars.SERVICE }}-$ENV"
          docker rm -f $CONTAINER_NAME 2>/dev/null || true
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p 8081:80 \
            ${{ vars.APP }}-${{ vars.SERVICE }}:latest

      # 8. Limpiar imágenes locales sobrantes
      - name: Cleanup images (local)
        if: always()
        run: |
          IMAGE="${{ vars.APP }}-${{ vars.SERVICE }}"
          # Elimina TODAS las imágenes locales excepto latest y rollback
          docker images $IMAGE --format "{{.Repository}}:{{.Tag}}" \
            | grep "^$IMAGE:" \
            | grep -v -E "^$IMAGE:latest$|^$IMAGE:rollback$" \
            | xargs -r docker rmi -f
          docker image prune -f